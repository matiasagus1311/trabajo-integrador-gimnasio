<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Encabezado común: Bootstrap por CDN (de la documentación) + nuestra hoja de estilos -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Gimnasio'">Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<!-- Barra de navegación del empleado -->
<nav th:fragment="navEmpleado" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/empleado}">Gimnasio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/empleado/ingresos}">Ingreso</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/empleado/socios}">Socios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/empleado/actividades}">Actividades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/empleado/planes}">Planes</a></li>
            </ul>
            <span class="navbar-text me-3" th:if="${usuario != null}" th:text="${usuario.nombre}">Empleado</span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Salir</a>
        </div>
    </div>
</nav>

<!-- Barra de navegación del socio -->
<nav th:fragment="navSocio" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/socio}">Gimnasio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/socio}">Mi abono</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/socio/actividades}">Actividades</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/socio/cuenta}">Mi cuenta</a></li>
            </ul>
            <span class="navbar-text me-3" th:if="${usuario != null}" th:text="${usuario.nombre}">Socio</span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Salir</a>
        </div>
    </div>
</nav>

<!-- Mensajes de confirmación (verde) y de error (rojo) -->
<div th:fragment="mensajes">
    <div class="alert alert-success" th:if="${exito}" th:text="${exito}">Guardado</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
</div>

<!-- JavaScript de Bootstrap (para el menú en el celular) -->
<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
