<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Actividad')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: navEmpleado}"></nav>
<div class="container">
    <h2 class="titulo" th:text="${id == 0} ? 'Nueva actividad' : 'Editar actividad'">Actividad</h2>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <form class="caja" method="post" th:object="${actividad}"
          th:action="${id == 0} ? @{/empleado/actividades/nueva} : @{/empleado/actividades/{id}/editar(id=${id})}">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}">
                <div class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Día</label>
                <select class="form-select" th:field="*{dia}">
                    <option value="">Elegí el día</option>
                    <option th:each="d : ${dias}" th:value="${d}" th:text="${d.texto}">Día</option>
                </select>
                <div class="error-campo" th:if="${#fields.hasErrors('dia')}" th:errors="*{dia}"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Hora de inicio</label>
                <input type="time" class="form-control" th:field="*{horaInicio}">
                <div class="error-campo" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Hora de fin</label>
                <input type="time" class="form-control" th:field="*{horaFin}">
                <div class="error-campo" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Cupo</label>
                <input type="number" class="form-control" min="1" max="100" th:field="*{cupo}">
                <div class="error-campo" th:if="${#fields.hasErrors('cupo')}" th:errors="*{cupo}"></div>
            </div>
        </div>
        <div class="form-check mb-3" th:if="${id != 0}">
            <input class="form-check-input" type="checkbox" th:field="*{activa}">
            <label class="form-check-label" th:for="${#ids.prev('activa')}">Activa (si no, los socios no la ven)</label>
        </div>
        <input type="hidden" th:if="${id == 0}" name="activa" value="true">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a class="btn btn-secondary" th:href="${id == 0} ? @{/empleado/actividades} : @{/empleado/actividades/{id}(id=${id})}">Cancelar</a>
    </form>
</div>
<script th:replace="~{fragmentos/base :: scripts}"></script>
</body>
</html>
