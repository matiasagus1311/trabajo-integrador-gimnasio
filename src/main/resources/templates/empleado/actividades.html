<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Actividades')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: navEmpleado}"></nav>
<div class="container">
    <h2 class="titulo">Actividades</h2>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <form class="caja row g-2" th:action="@{/empleado/actividades}" method="get">
        <div class="col-md-4">
            <select class="form-select" name="dia">
                <option value="">Todos los días</option>
                <option th:each="d : ${dias}" th:value="${d}" th:text="${d.texto}" th:selected="${d == dia}">Día</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </form>

    <div class="caja">
        <a class="btn btn-success mb-3" th:href="@{/empleado/actividades/nueva}">Nueva actividad</a>
        <p th:if="${#lists.isEmpty(actividades)}" class="text-muted">No hay actividades.</p>
        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(actividades)}">
            <thead>
            <tr><th>Actividad</th><th>Día</th><th>Horario</th><th>Inscriptos</th><th>Lugares libres</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="a : ${actividades}" th:classappend="${!a.activa} ? 'text-muted'">
                <td>
                    <span th:text="${a.nombre}"></span>
                    <span th:if="${!a.activa}" class="badge bg-secondary">Inactiva</span>
                </td>
                <td th:text="${a.dia.texto}"></td>
                <td th:text="${a.horaInicio} + ' a ' + ${a.horaFin}"></td>
                <td th:text="${#lists.size(a.inscriptos)} + ' / ' + ${a.cupo}"></td>
                <td>
                    <span th:if="${a.hayCupo()}" th:text="${a.lugaresLibres}"></span>
                    <span th:unless="${a.hayCupo()}" class="badge bg-danger">Completa</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/empleado/actividades/{id}(id=${a.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/empleado/actividades/{id}/editar(id=${a.id})}">Editar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:replace="~{fragmentos/base :: scripts}"></script>
</body>
</html>
