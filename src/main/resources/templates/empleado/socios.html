<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Socios')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: navEmpleado}"></nav>
<div class="container">
    <h2 class="titulo">Socios</h2>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <!-- Búsqueda y filtros (GET: los datos viajan en la URL) -->
    <form class="caja row g-2" th:action="@{/empleado/socios}" method="get">
        <div class="col-md-4">
            <input type="text" class="form-control" name="texto" th:value="${texto}"
                   placeholder="Nombre, apellido o DNI">
        </div>
        <div class="col-md-3">
            <select class="form-select" name="planId">
                <option value="0">Todos los planes</option>
                <option th:each="p : ${planes}" th:value="${p.id}" th:text="${p.nombre}"
                        th:selected="${p.id == planId}">Plan</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="estado">
                <option value="" th:selected="${estado == ''}">Activos</option>
                <option value="vigente" th:selected="${estado == 'vigente'}">Abono vigente</option>
                <option value="vencido" th:selected="${estado == 'vencido'}">Abono vencido</option>
                <option value="baja" th:selected="${estado == 'baja'}">Dados de baja</option>
                <option value="todos" th:selected="${estado == 'todos'}">Todos</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
    </form>

    <div class="caja">
        <a class="btn btn-success mb-3" th:href="@{/empleado/socios/nuevo}">Nuevo socio</a>

        <p th:if="${#lists.isEmpty(socios)}" class="text-muted">No hay socios con esos datos.</p>

        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(socios)}">
            <thead>
            <tr>
                <th>Apellido y nombre</th>
                <th>DNI</th>
                <th>Plan</th>
                <th>Abono</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${socios}">
                <td th:text="${s.apellido} + ', ' + ${s.nombre}">Gómez, Ana</td>
                <td th:text="${s.dni}">40111222</td>
                <td th:text="${s.plan != null} ? ${s.plan.nombre} : '-'">Plan</td>
                <td>
                    <span th:if="${!s.activo}" class="badge bg-secondary">De baja</span>
                    <span th:if="${s.activo and s.abonoVigente}" class="badge bg-success"
                          th:text="'Hasta ' + ${#temporals.format(s.venceAbono, 'dd/MM/yyyy')}">Vigente</span>
                    <span th:if="${s.activo and !s.abonoVigente}" class="badge bg-danger">Vencido</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/empleado/socios/{id}(id=${s.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/empleado/socios/{id}/editar(id=${s.id})}">Editar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:replace="~{fragmentos/base :: scripts}"></script>
</body>
</html>
