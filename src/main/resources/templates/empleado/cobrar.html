<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Cobrar')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: navEmpleado}"></nav>
<div class="container">
    <h2 class="titulo">Cobrar cuota</h2>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="caja col-md-6">
        <p class="mb-1"><b>Socio:</b> <span th:text="${socio.nombreCompleto} + ' (DNI ' + ${socio.dni} + ')'"></span></p>
        <p class="mb-1"><b>Plan actual:</b> <span th:text="${socio.plan.nombre}"></span></p>
        <p class="mb-3"><b>Cubre:</b>
            <span th:text="'del ' + ${#temporals.format(pago.desde, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(pago.hasta, 'dd/MM/yyyy')}"></span></p>

        <form method="post" th:action="@{/empleado/socios/{id}/cobrar(id=${socio.id})}">
            <!-- Abono a cobrar: viene marcado el plan que ya tiene. Si se elige otro, se le cambia el plan. -->
            <label class="form-label">Abono</label>
            <div class="form-check mb-1" th:each="p : ${planes}">
                <input class="form-check-input" type="radio" name="planId" th:id="'plan' + ${p.id}"
                       th:value="${p.id}" th:checked="${p.id == socio.plan.id}" required>
                <label class="form-check-label" th:for="'plan' + ${p.id}"
                       th:text="${p.nombre} + ' - $ ' + ${#numbers.formatDecimal(socio.calcularCuota(p), 1, 'POINT', 2, 'COMMA')}">Plan</label>
            </div>
            <p class="text-muted mb-3"><small>Los precios ya tienen aplicados los descuentos del socio.</small></p>

            <label class="form-label">Medio de pago</label>
            <select class="form-select mb-3" name="medioPago" required>
                <option value="">Elegí cómo paga</option>
                <option th:each="m : ${medios}" th:value="${m}" th:text="${m.texto}">Efectivo</option>
            </select>
            <button type="submit" class="btn btn-success">Confirmar cobro</button>
            <a class="btn btn-secondary" th:href="@{/empleado/socios/{id}(id=${socio.id})}">Cancelar</a>
        </form>
    </div>
</div>
<script th:replace="~{fragmentos/base :: scripts}"></script>
</body>
</html>
