<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: head('Cobrar')}"></head>
<body>
<nav th:replace="~{fragmentos/base :: navEmpleado}"></nav>
<div class="container">
    <h2 class="titulo">Cobrar cuota</h2>
    <div th:replace="~{fragmentos/base :: mensajes}"></div>

    <div class="caja col-md-6">
        <p class="mb-1"><b>Socio:</b> <span th:text="${socio.nombreCompleto} + ' (DNI ' + ${socio.dni} + ')'"></span></p>
        <p class="mb-3"><b>Cubre:</b>
            <span th:text="'del ' + ${#temporals.format(pago.desde, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(pago.hasta, 'dd/MM/yyyy')}"></span></p>

        <form method="post" th:action="@{/empleado/socios/{id}/cobrar(id=${socio.id})}">
            <!-- Tipo de abono: viene marcado el que tenía (si ya pagó alguna vez) -->
            <label class="form-label">Tipo de abono</label>
            <div class="form-check" th:each="p : ${planes}">
                <input class="form-check-input" type="radio" name="planId" th:id="'plan' + ${p.id}"
                       th:value="${p.id}" th:attr="data-precio=${p.precioMensual}"
                       th:checked="${socio.plan != null and p.id == socio.plan.id}" required>
                <label class="form-check-label" th:for="'plan' + ${p.id}"
                       th:text="${p.nombre} + ' - $ ' + ${#numbers.formatDecimal(p.precioMensual, 1, 'POINT', 2, 'COMMA')}">Plan</label>
            </div>

            <label class="form-label mt-3">Descuentos</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="grupoFamiliar" name="grupoFamiliar" value="true"
                       th:checked="${socio.grupoFamiliar}">
                <label class="form-check-label" for="grupoFamiliar">Grupo familiar (10%)</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="empleadoComercio" name="empleadoComercio" value="true"
                       th:checked="${socio.empleadoComercio}">
                <label class="form-check-label" for="empleadoComercio">Empleado de comercio (20%)</label>
            </div>

            <p class="puede-pasar">Total a pagar: <span id="total">elegí el abono</span></p>

            <label class="form-label">Medio de pago</label>
            <select class="form-select mb-3" name="medioPago" required>
                <option value="">Elegí cómo paga</option>
                <option th:each="m : ${medios}" th:value="${m}" th:text="${m.texto}">Efectivo</option>
            </select>
            <button type="submit" class="btn btn-success">Confirmar cobro</button>
            <a class="btn btn-secondary" th:href="@{/empleado/socios/{id}(id=${socio.id})}">Cancelar</a>
        </form>
    </div>
</div>
<script th:replace="~{fragmentos/base :: scripts}"></script>
<script>
    // Muestra el total mientras se elige (el monto que se guarda lo calcula el servidor con la misma regla)
    function calcularTotal() {
        const plan = document.querySelector('input[name="planId"]:checked');
        if (!plan) return;
        let total = parseFloat(plan.dataset.precio);
        if (document.getElementById('grupoFamiliar').checked) total = total * 0.9;
        if (document.getElementById('empleadoComercio').checked) total = total * 0.8;
        document.getElementById('total').textContent =
            '$ ' + total.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    document.querySelectorAll('input').forEach(function (campo) { campo.addEventListener('change', calcularTotal); });
    calcularTotal();
</script>
</body>
</html>
